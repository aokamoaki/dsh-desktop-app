<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  :root {
    --bar-h: 36px;
    --brand: #4d6bfe;
    --brand-2: #7c5cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgba(24, 27, 34, .92);
      --fg: #d6dbe7;
      --hover: rgba(255, 255, 255, .07);
      --active: rgba(255, 255, 255, .12);
      --line: rgba(255, 255, 255, .06);
      --shadow: 0 1px 8px rgba(0, 0, 0, .45);
    }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: rgba(246, 248, 252, .94);
      --fg: #232a3a;
      --hover: rgba(20, 30, 60, .07);
      --active: rgba(20, 30, 60, .13);
      --line: rgba(20, 30, 60, .08);
      --shadow: 0 1px 6px rgba(30, 40, 80, .12);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12px;
    user-select: none;
    background: var(--bg);
    color: var(--fg);
  }
  #bar {
    height: var(--bar-h);
    display: flex;
    align-items: center;
    padding: 0 4px 0 12px;
    -webkit-app-region: drag;
    gap: 8px;
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  /* brand status dot with glow */
  .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #6b7c93, #46536a);
    transition: background .25s ease;
  }
  .dot.running {
    background: linear-gradient(135deg, #3ddc84, #1fa855);
    box-shadow: 0 0 8px rgba(52, 199, 89, .55);
    animation: glow 2s ease-in-out infinite;
  }
  .dot.error {
    background: linear-gradient(135deg, #ff6b6b, #d93025);
    box-shadow: 0 0 8px rgba(229, 72, 77, .5);
  }
  .dot.starting, .dot.installing {
    background: linear-gradient(135deg, #6e8bff, #4d6bfe);
    box-shadow: 0 0 8px rgba(77, 107, 254, .6);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  @keyframes glow { 50% { box-shadow: 0 0 14px rgba(52, 199, 89, .8); } }
  #title {
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 600;
    letter-spacing: .2px;
  }
  #title .url {
    color: var(--fg);
    opacity: .55;
    font-weight: 400;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 11px;
    margin-left: 6px;
  }
  .btn {
    -webkit-app-region: no-drag;
    width: 38px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--fg);
    border-radius: 6px; cursor: default;
    opacity: .85;
    transition: background .12s ease, opacity .12s ease;
  }
  .btn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.3; }
  .btn:hover { background: var(--hover); opacity: 1; }
  .btn:active { background: var(--active); }
  .btn.close:hover { background: #e5484d; color: #fff; }
  .btn.close:active { background: #c73a40; }
</style>
</head>
<body>
  <div id="bar">
    <span class="dot" id="dot"></span>
    <span id="title">DeepSeek Harness<span class="url" id="urlText"></span></span>
    <button class="btn" id="min" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6"/></svg>
    </button>
    <button class="btn" id="max" title="Maximize" aria-label="Maximize">
      <svg id="maxIcon" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1"/></svg>
    </button>
    <button class="btn close" id="close" title="Close" aria-label="Close">
      <svg viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg>
    </button>
  </div>
  <script>
    const zh = new URLSearchParams(location.search).get('lang') === 'zh';
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    const U = zh
      ? { minimize: '最小化', maximize: '最大化', restore: '还原', close: '关闭' }
      : { minimize: 'Minimize', maximize: 'Maximize', restore: 'Restore', close: 'Close' };
    const minBtn = document.getElementById('min');
    const maxBtn = document.getElementById('max');
    const closeBtn = document.getElementById('close');
    const dotEl = document.getElementById('dot');
    const titleEl = document.getElementById('title');
    const urlEl = document.getElementById('urlText');
    minBtn.title = U.minimize;
    maxBtn.title = U.maximize;
    closeBtn.title = U.close;
    // aria-labels follow the language too (accessibility parity with titles).
    minBtn.setAttribute('aria-label', U.minimize);
    maxBtn.setAttribute('aria-label', U.maximize);
    closeBtn.setAttribute('aria-label', U.close);
    minBtn.addEventListener('click', () => window.dsh.minimize());
    closeBtn.addEventListener('click', () => window.dsh.close());
    maxBtn.addEventListener('click', () => window.dsh.maximize().then(renderMax));
    document.getElementById('bar').addEventListener('dblclick', (e) => {
      // Clicks land on the button's <svg>/<line> children, not the <button>
      // element - match any ancestor button so double-clicking a window
      // control never ALSO triggers maximize.
      if (e.target && e.target.closest && e.target.closest('button')) return;
      window.dsh.maximize().then(renderMax);
    });
    function renderMax(m) {
      document.getElementById('maxIcon').innerHTML = m
        ? '<rect x="3.2" y="3.2" width="6.6" height="6.6" rx="1"/><line x1="2.2" y1="6.8" x2="2.2" y2="9.8"/><line x1="2.2" y1="9.8" x2="5.2" y2="9.8"/>'
        : '<rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1"/>';
      maxBtn.title = m ? U.restore : U.maximize;
      maxBtn.setAttribute('aria-label', m ? U.restore : U.maximize);
    }
    function renderPhase(s) {
      const p = (s && s.phase) || 'stopped';
      dotEl.className = 'dot' + (p === 'running' ? ' running' : p === 'error' ? ' error' : (p === 'starting' || p === 'installing') ? ' starting' : '');
      urlEl.textContent = (s && s.url) ? s.url.replace(/^https?:\/\//, '') : '';
    }
    window.dsh.getStatus().then((s) => { renderPhase(s); window.dsh.isMaximized().then(renderMax); });
    window.dsh.onStatus(renderPhase);
  </script>
</body>
</html>
