<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>DeepSeek Harness</title>
<style>
  /* Visual language replicated from the dsh web main UI (--dsw-alias tokens,
     real computed values extracted from the running web app). The dashboard
     follows the main UI's theme via ?theme=light|dark|system. */
  :root, html[data-theme="light"] {
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-bg-overlay: #e9ecf2;
    --dsw-alias-border-l1: rgba(0, 0, 0, .04);
    --dsw-alias-border-l2: rgba(0, 0, 0, .1);
    --dsw-alias-brand-primary: #0f1115;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-state-error-primary: #ec1313;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-specific-sidebar-fill: #f9fafb;
  }
  html[data-theme="dark"] {
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #232324;
    --dsw-alias-bg-layer-2: #2c2c2e;
    --dsw-alias-bg-overlay: #61666b;
    --dsw-alias-border-l1: rgba(255, 255, 255, .06);
    --dsw-alias-border-l2: rgba(255, 255, 255, .12);
    --dsw-alias-brand-primary: #f9fafb;
    --dsw-alias-label-primary: #f9fafb;
    --dsw-alias-label-secondary: #cfd3d6;
    --dsw-alias-label-tertiary: #adb2b8;
    --dsw-alias-state-error-primary: #f25a5a;
    --dsw-alias-state-success-primary: #22c55e;
    --dsw-alias-state-warn-primary: #f59e0b;
    --dsw-specific-sidebar-fill: #1b1b1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    font-size: 13px;
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    padding: 18px 20px 22px;
  }
  /* header */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .app-badge { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .app-badge img { width: 20px; height: 20px; }
  header h1 { font-size: 14px; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; letter-spacing: .2px; }
  header h1 .sub { color: var(--dsw-alias-label-secondary); font-weight: 400; font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500;
    border: 1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dsw-alias-label-tertiary); }
  .pill.running { color: var(--dsw-alias-state-success-primary); } .pill.running .dot { background: var(--dsw-alias-state-success-primary); }
  .pill.error { color: var(--dsw-alias-state-error-primary); } .pill.error .dot { background: var(--dsw-alias-state-error-primary); }
  .pill.starting, .pill.installing { color: var(--dsw-alias-brand-primary); } .pill.starting .dot, .pill.installing .dot { background: var(--dsw-alias-brand-primary); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card {
    background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l1);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
    transition: border-color .15s ease;
  }
  .card:hover { border-color: var(--dsw-alias-border-l2); }
  .card h2 {
    font-size: 11px; font-weight: 600; color: var(--dsw-alias-label-secondary);
    margin-bottom: 10px; text-transform: uppercase; letter-spacing: .7px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .row .lbl { color: var(--dsw-alias-label-secondary); font-size: 12px; }
  .row .val { font-weight: 500; word-break: break-all; }
  .val.mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  .btnrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .guardline { font-size: 12px; padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  .guardline.ok { color: var(--dsw-alias-state-success-primary); }
  .guardline.warn { color: var(--dsw-alias-state-warn-primary); }
  .guardline.bad { color: var(--dsw-alias-state-error-primary); }
  .guardline .ic { font-size: 11px; width: 14px; text-align: center; flex: none; }
  .guardline > span:last-child { overflow-wrap: anywhere; }
  /* frameless window: the page header IS the title bar (drag to move) */
  header { -webkit-app-region: drag; }
  .no-drag { -webkit-app-region: no-drag; }
  .winctls { display: inline-flex; align-items: center; gap: 2px; margin-left: 4px; }
  .winbtn {
    width: 34px; height: 26px; padding: 0; border: none; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--dsw-alias-label-primary);
    cursor: default; opacity: .85;
  }
  .winbtn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.3; }
  .winbtn:hover { background: var(--dsw-alias-bg-overlay); opacity: 1; border-color: transparent; }
  .winbtn.winbtn-close:hover { background: var(--dsw-alias-state-error-primary); color: #fff; }
  /* ghost buttons, matching the main UI (transparent + text color) */
  button {
    border: 1px solid var(--dsw-alias-border-l2); background: transparent; color: var(--dsw-alias-label-primary);
    padding: 5px 13px; border-radius: 8px; font-size: 12px; cursor: pointer;
    font-family: inherit;
    transition: border-color .12s ease, color .12s ease, opacity .12s ease;
  }
  button:hover { border-color: var(--dsw-alias-label-secondary); }
  button:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 1px; }
  button.primary {
    border-color: var(--dsw-alias-brand-primary);
    color: var(--dsw-alias-brand-primary);
    font-weight: 500;
  }
  button.primary:hover { border-color: var(--dsw-alias-label-primary); color: var(--dsw-alias-label-primary); }
  button:disabled { opacity: .45; cursor: default; }
  select {
    border: 1px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary);
    padding: 5px 9px; border-radius: 8px; font-size: 12px; font-family: inherit;
  }
  select:focus-visible { outline: 2px solid var(--dsw-alias-brand-primary); outline-offset: 1px; }
  /* toggle switch: checked track = brand emphasis, thumb = base (contrasts in
     both themes, like the main UI's emphasis color usage) */
  .switch { position: relative; width: 34px; height: 19px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--dsw-alias-bg-overlay); transition: background .18s ease;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--dsw-alias-label-primary); transition: transform .18s ease, background .18s ease;
  }
  .switch input:checked + .track { background: var(--dsw-alias-brand-primary); }
  .switch input:checked + .track::after { transform: translateX(15px); background: var(--dsw-alias-bg-base); }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .msg.ok { color: var(--dsw-alias-state-success-primary); } .msg.err { color: var(--dsw-alias-state-error-primary); }
  pre {
    height: 200px; overflow: auto; font-size: 11px; line-height: 1.55;
    background: var(--dsw-alias-bg-layer-2); border: 1px solid var(--dsw-alias-border-l1); border-radius: 9px;
    padding: 10px 12px; white-space: pre-wrap; word-break: break-all; color: var(--dsw-alias-label-tertiary);
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--dsw-alias-border-l2); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <header>
    <div class="app-badge no-drag"><img id="badgeIcon" src="../assets/icon.png" alt=""></div>
    <h1>DeepSeek Harness <span class="sub">· <span id="dashTitle">Dashboard</span></span></h1>
    <span class="pill no-drag" id="phasePill"><span class="dot"></span><span id="phase">stopped</span></span>
    <div class="winctls no-drag">
      <button class="winbtn" id="winMin" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6"/></svg>
      </button>
      <button class="winbtn" id="winMax" title="Maximize" aria-label="Maximize">
        <svg id="maxIcon" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1"/></svg>
      </button>
      <button class="winbtn winbtn-close" id="winClose" title="Close" aria-label="Close">
        <svg viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9"/><line x1="9" y1="3" x2="3" y2="9"/></svg>
      </button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2 id="hService">Service</h2>
      <div class="row"><span class="lbl" id="lStatus">Status</span><span class="val" id="phaseDetail">-</span></div>
      <div class="row"><span class="lbl" id="lAddr">Address</span><span class="val mono" id="url">-</span></div>
      <div class="btnrow">
        <button id="restart" class="primary">Restart</button>
        <button id="browser">Open in Browser</button>
        <button id="logs">Logs Folder</button>
      </div>
      <div class="btnrow">
        <button id="copyUrl">Copy URL</button>
        <button id="dataDir">Data Folder</button>
      </div>
      <div class="btnrow" style="margin-top:6px">
        <span style="display:inline-flex;align-items:center;gap:8px;color:var(--dsw-alias-label-secondary);font-size:12px;cursor:pointer">
          <span id="lAutoLaunch" style="cursor:pointer">Launch at login</span>
          <label class="switch"><input type="checkbox" id="autoLaunch"><span class="track"></span></label>
        </span>
        <button id="diag" style="margin-left:auto">Export Diagnostics</button>
      </div>
    </div>

    <div class="card">
      <h2 id="hGuard">Startup Guard</h2>
      <div id="guardbox"><div class="guardline" style="color:var(--dsw-alias-label-secondary)">-</div></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="hDshVer">dsh Version</h2>
      <div class="row"><span class="lbl" id="lCur">Current</span><span class="val mono" id="cur">-</span></div>
      <div class="row"><span class="lbl" id="lLatest">Latest</span><span class="val mono" id="latest">-</span></div>
      <div class="btnrow">
        <select id="versions" title="Rollback target"></select>
        <button id="update">Update / Rollback</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <h2 id="hAppVer">Desktop App</h2>
      <div class="row"><span class="lbl" id="lAppVer">Version</span><span class="val mono" id="appver">-</span></div>
      <div class="btnrow">
        <button id="chkUpdate">Check for Updates</button>
        <button id="dlUpdate" style="display:none" class="primary">Download &amp; Install</button>
      </div>
      <div class="msg" id="umsg"></div>
    </div>
  </div>

  <div class="card">
    <h2 id="hLogs" style="display:flex;align-items:center;justify-content:space-between"><span id="logsTitle">Logs</span> <button id="refresh" style="text-transform:uppercase;letter-spacing:.5px;font-size:10.5px">Refresh</button></h2>
    <pre id="logpre"></pre>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
